<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOS MATRIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --accent: #007aff;
            --card-bg: #0a0a0a;
            --border: #1a1a1a;
            --text-main: #ffffff;
            --text-dim: #555555;
            --glass: rgba(10, 10, 10, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            position: relative;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            margin-bottom: 8px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--text-dim);
        }

        .system-status {
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 45px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:active {
            transform: scale(0.96);
            border-color: var(--accent);
        }

        .icon-box {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 1.5;
        }

        .card-content {
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }

        .card-subtitle {
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-top: 4px;
        }

        .indicator {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background: #ffffff;
            border-radius: 10px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <header>
            <div class="logo">XOS <span>MATRIX</span></div>
        </header>

        <div class="system-status">
            <div class="status-dot"></div>
            Quit your old matrix
        </div>

        <div class="card-list">
            <a href="weapon.html" class="card">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-title">The Weapon</div>
                    <div class="card-subtitle">Tacticas to deal with your crush</div>
                </div>
            </a>

            <a href="Final x.html" class="card">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="stroke: #4cd964;">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-title">Viksit Bharat</div>
                    <div class="card-subtitle">National Architecture 2047</div>
                </div>
            </a>
        </div>
    </div>

    <div class="indicator"></div>

</body>
</html>
